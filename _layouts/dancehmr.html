<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    {% include seo.html title=page.title %}
    <link rel="icon" type="image/svg+xml" href="{{ '/dancehmr/img/favicon.svg' | relative_url }}">
    <link rel="preload" href="{{ '/assets/fonts/academic/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/dancehmr/css/project.css' | relative_url }}">

  <body class="dancehmr-site">

        <a href="#BkgdVideos">Gallery</a>

    <main id="main" tabindex="-1">{{ content }}</main>
    {% include analytics.html %}

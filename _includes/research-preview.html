<div class="publication-media"{% if include.video %} data-video-preview{% endif %}>
  <a class="publication-image" href="{{ include.url }}" tabindex="-1" aria-hidden="true">
    {% if include.image %}
    <img src="{{ include.image | relative_url }}" alt="{{ include.image_alt | escape }}" width="640" height="400" loading="lazy" decoding="async">
    {% if include.video %}<video data-src="{{ include.video | relative_url }}" poster="{{ include.image | relative_url }}" muted loop playsinline preload="none" aria-hidden="true" tabindex="-1"></video>{% endif %}
    {% else %}
    <span class="publication-image-fallback"><i class="fas fa-file-alt" aria-hidden="true"></i><span>{{ include.venue }}</span></span>
    {% endif %}
  </a>
  {% if include.video %}<button class="preview-toggle" type="button" aria-label="Play video preview" title="Play video preview" aria-describedby="{{ include.title_id }}" hidden><i class="fas fa-play" aria-hidden="true"></i></button>{% endif %}
</div>

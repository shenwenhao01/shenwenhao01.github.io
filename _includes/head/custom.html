{% include base_path %}

<!-- start custom head snippets -->

<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

{% if page.academic %}
<link rel="preload" href="{{ '/assets/fonts/academic/inter-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/academic/newsreader-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
{% endif %}

{% if page.math or page.collection == 'posts' %}
<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>
{% endif %}

<!-- end custom head snippets -->
